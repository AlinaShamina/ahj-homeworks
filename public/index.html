<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Collapsible Widget</title>
</head>
<body>
  <h1>Collapsible Widget</h1>

  <div class="collapsible-container">
    <button class="collapsible">Развернуть/Свернуть</button>
    <div class="content">
      <p>Содержимое контейнера...</p>
      <p>Привет, мир!</p>
    </div>
  </div>
</body>
</html>
